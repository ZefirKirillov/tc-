# Backup keep-alive for the Render free-tier Web Service.
# Render suspends a free service after ~15 min without inbound HTTP traffic;
# this pings /healthz from outside so a missed UptimeRobot check (or a dead
# monitor) can't let the bot spin down. See RENDER_DEPLOY.md.
name: keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /healthz
        run: |
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors --max-time 90 \
            https://trackcheckv2.onrender.com/healthz
